name: Bug report
description: Something in Candle doesn't work the way it says it does.
body:
  - type: markdown
    attributes:
      value: |
        Never paste a private key, seed phrase, API key or token. For a vulnerability, email security@candle.tv instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or tool you ran, and the error or result you got back.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: candle --version
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 on arm64
