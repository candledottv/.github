name: Feature request
description: Ask for something Candle doesn't do yet.
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The task, in your own words. Not the solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround you use now, if any.
  - type: textarea
    id: more
    attributes:
      label: Anything else
